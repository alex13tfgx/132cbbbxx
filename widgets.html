<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Arbuz.cc — Overlay Widgets</title>
<style>
  :root {
    --pill-bg: #2C2F33;
    --accent: #3DDC97;
    --accent-bright: #4EF2C3;
    --text: #FFFFFF;
    --text-muted: #D2D6DB;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    justify-content: center;
    gap: 14px;
    padding: 40px;
    background: #FFFFFF;
    font-family: "Inter", "Segoe UI", Roboto, Arial, sans-serif;
  }

  .pill {
    display: flex;
    align-items: center;
    background: var(--pill-bg);
    border-radius: 50px;
    color: var(--text);
    box-shadow: 0 6px 20px rgba(0, 0, 0, .18), 0 1px 2px rgba(0, 0, 0, .12);
    white-space: nowrap;
  }

  /* --- Верхний виджет --- */
  .pill--main {
    gap: 14px;
    padding: 12px 26px 12px 20px;
    font-size: 16px;
    font-weight: 600;
  }

  .pill--main .logo {
    width: 22px;
    height: 22px;
    flex-shrink: 0;
    color: var(--accent-bright);
  }

  .brand { color: var(--text); }

  .divider {
    width: 18px;
    height: 18px;
    border-radius: 50%;
    border: 2px solid var(--accent-bright);
    background: var(--pill-bg);
    flex-shrink: 0;
  }

  .credits {
    color: var(--text-muted);
    font-weight: 500;
  }

  /* --- Нижний виджет --- */
  .pill--stats {
    gap: 22px;
    padding: 8px 20px;
    font-size: 13px;
    font-weight: 500;
  }

  .stat {
    display: flex;
    align-items: center;
    gap: 7px;
  }

  .stat svg {
    width: 14px;
    height: 14px;
    flex-shrink: 0;
    color: var(--accent);
  }

  @media (max-width: 520px) {
    body { padding: 20px; align-items: stretch; }
    .pill { flex-wrap: wrap; white-space: normal; justify-content: center; }
    .pill--main { font-size: 14px; padding: 10px 18px; gap: 10px; }
    .pill--stats { justify-content: space-around; gap: 12px; }
  }
</style>
</head>
<body>

  <!-- Верхний виджет -->
  <div class="pill pill--main">
    <!-- Логотип: стилизованная "A" -->
    <svg class="logo" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
      <path d="M12 2.5 22.5 21H1.5L12 2.5Z" fill="currentColor"/>
      <path d="M12 10 16 17H8l4-7Z" fill="#2C2F33"/>
    </svg>

    <span class="brand">Arbuz.cc</span>

    <span class="divider" aria-hidden="true"></span>

    <span class="credits">by duckcorp and pastacompany</span>
  </div>

  <!-- Нижний виджет -->
  <div class="pill pill--stats">
    <div class="stat">
      <!-- Глобус -->
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
           stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <circle cx="12" cy="12" r="9"/>
        <path d="M3 12h18M12 3c2.5 2.7 2.5 15.3 0 18-2.5-2.7-2.5-15.3 0-18Z"/>
      </svg>
      <span>Singleplayer</span>
    </div>

    <div class="stat">
      <!-- Молния -->
      <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
        <path d="M13 2 4 14h6l-1 8 9-12h-6l1-8Z"/>
      </svg>
      <span>54fps</span>
    </div>

    <div class="stat">
      <!-- Облако -->
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
           stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M17.5 19a4.5 4.5 0 0 0 .5-8.97A6 6 0 0 0 6.2 10.3 3.85 3.85 0 0 0 7 19h10.5Z"/>
      </svg>
      <span>0ms</span>
    </div>
  </div>

</body>
</html>
